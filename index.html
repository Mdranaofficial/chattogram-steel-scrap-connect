<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chattogram Steel Scrap Connect</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#0a9d4a;--gd:#067a38;--bg:#0d1210;--card:#161d19;--bd:#26322b;--tx:#eef3ef;--mu:#9bab9f;--rd:#e5484d;--yl:#f5b73b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
header{padding:18px 16px 8px;text-align:center}
header h1{margin:0;font-size:22px;color:var(--g);font-style:italic}
header p{margin:2px 0 0;color:var(--mu);font-size:13px;letter-spacing:2px}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--bd)}
nav button{flex:0 0 auto;background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:9px 14px;border-radius:999px;font-size:14px}
nav button.on{background:var(--g);border-color:var(--g);color:#fff}
main{max-width:760px;margin:0 auto;padding:14px}
.sec{display:none}.sec.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:12px;overflow:hidden}
.card .pad{padding:12px 14px}
.imgs{display:flex;gap:2px;overflow-x:auto;background:#000}
.imgs img{height:170px;width:auto;max-width:100%;object-fit:cover;flex:0 0 auto}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;font-weight:600}
.sell{background:#0a9d4a22;color:#3ddc84}.buy{background:#f5b73b22;color:var(--yl)}
.pending{background:#f5b73b22;color:var(--yl)}.approved{background:#0a9d4a22;color:#3ddc84}.rejected,.sold{background:#e5484d22;color:#ff8a8e}
h3{margin:6px 0 4px;font-size:17px}
.meta{color:var(--mu);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;color:#fff;background:var(--g);text-decoration:none;display:inline-block}
.btn.wa{background:#25d366;color:#04210f}.btn.gray{background:#2a3530}.btn.red{background:var(--rd)}.btn.sm{padding:7px 11px;font-size:13px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;background:#0f1612;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px;font-size:15px;font-family:inherit}
textarea{min-height:80px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.filters input{grid-column:1/-1}
.msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px;display:none}
.msg.ok{display:block;background:#0a9d4a22;color:#3ddc84}.msg.err{display:block;background:#e5484d22;color:#ff8a8e}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.prev{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.prev img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}.modal .box{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px}
h2{font-size:18px;margin:4px 0 8px}
.tabs2{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
footer{text-align:center;color:var(--mu);font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
  <h1>Chattogram Steel Scrap Connect</h1>
  <p>BUY · SELL · CONNECT</p>
</header>
<nav id="nav">
  <button data-t="list" class="on">বিজ্ঞপ্তি</button>
  <button data-t="post">বিজ্ঞপ্তি দিন</button>
  <button data-t="join">সদস্য হোন</button>
  <button data-t="admin">অ্যাডমিন</button>
</nav>
<main>

<section id="list" class="sec on">
  <div class="filters">
    <input id="q" placeholder="খুঁজুন (স্ক্র্যাপের নাম, এলাকা…)">
    <select id="ft"><option value="">সব ধরন</option><option value="sell">বিক্রয়</option><option value="buy">ক্রয়</option></select>
    <button class="btn gray" id="reload">রিফ্রেশ</button>
  </div>
  <div id="listings"></div>
</section>

<section id="post" class="sec">
  <h2>নতুন বিজ্ঞপ্তি দিন</h2>
  <p class="meta">অ্যাডমিন অনুমোদন দিলে বিজ্ঞপ্তি সাইটে দেখা যাবে।</p>
  <form id="postForm">
    <label>ধরন</label>
    <select name="type" required><option value="sell">স্ক্র্যাপ বিক্রি করব</option><option value="buy">স্ক্র্যাপ কিনব</option></select>
    <label>শিরোনাম</label><input name="title" required placeholder="যেমন: ২০ টন এমএস স্ক্র্যাপ">
    <label>স্ক্র্যাপের ধরন</label><input name="scrap_type" required placeholder="লোহা, স্টিল, শিপ ব্রেকিং…">
    <div class="two">
      <div><label>পরিমাণ</label><input name="quantity" type="number" step="any" inputmode="decimal"></div>
      <div><label>একক</label><select name="unit"><option>ton</option><option>kg</option><option>pcs</option></select></div>
    </div>
    <div class="two">
      <div><label>দাম (টাকা)</label><input name="price" type="number" step="any" inputmode="decimal"></div>
      <div><label>দামের নোট</label><input name="price_note" placeholder="প্রতি টন / আলোচনা সাপেক্ষ"></div>
    </div>
    <label>এলাকা</label><input name="area" placeholder="যেমন: কুমিরা, ফৌজদারহাট">
    <label>বিবরণ</label><textarea name="description"></textarea>
    <label>আপনার নাম</label><input name="contact_name" required>
    <div class="two">
      <div><label>ফোন</label><input name="phone" required inputmode="tel" placeholder="01XXXXXXXXX"></div>
      <div><label>WhatsApp</label><input name="whatsapp" inputmode="tel" placeholder="খালি থাকলে ফোন নম্বর"></div>
    </div>
    <label>ছবি (সর্বোচ্চ ৪টি)</label>
    <input id="imgs" type="file" accept="image/*" multiple>
    <div class="prev" id="prev"></div>
    <div id="postMsg" class="msg"></div>
    <div class="row"><button class="btn" id="postBtn" type="submit">জমা দিন</button></div>
  </form>
</section>

<section id="join" class="sec">
  <h2>Buyer / Supplier নেটওয়ার্কে যোগ দিন</h2>
  <form id="joinForm">
    <label>আপনি কে?</label>
    <select name="role"><option value="buyer">ক্রেতা (Buyer)</option><option value="supplier">সরবরাহকারী (Supplier)</option><option value="both">দুটোই</option></select>
    <label>নাম</label><input name="name" required>
    <label>প্রতিষ্ঠান</label><input name="company">
    <div class="two">
      <div><label>ফোন</label><input name="phone" required inputmode="tel"></div>
      <div><label>WhatsApp</label><input name="whatsapp" inputmode="tel"></div>
    </div>
    <label>এলাকা</label><input name="area">
    <label>ঠিকানা</label><input name="address">
    <div id="joinMsg" class="msg"></div>
    <div class="row"><button class="btn" type="submit">আবেদন পাঠান</button></div>
  </form>
</section>

<section id="admin" class="sec">
  <div id="loginBox">
    <h2>অ্যাডমিন লগইন</h2>
    <form id="loginForm">
      <label>ইমেইল</label><input name="email" type="email" required autocomplete="username">
      <label>পাসওয়ার্ড</label><input name="password" type="password" required autocomplete="current-password">
      <div id="loginMsg" class="msg"></div>
      <div class="row"><button class="btn" type="submit">লগইন</button></div>
    </form>
  </div>
  <div id="dash" style="display:none">
    <div class="row" style="justify-content:space-between;margin:0 0 10px"><h2 style="margin:0">ড্যাশবোর্ড</h2><button class="btn gray sm" id="logout">লগআউট</button></div>
    <div class="tabs2" id="atabs">
      <button class="btn sm" data-a="listings">বিজ্ঞপ্তি</button>
      <button class="btn gray sm" data-a="members">সদস্য</button>
      <button class="btn gray sm" data-a="inquiries">বার্তা</button>
    </div>
    <div id="adminList"></div>
  </div>
</section>

</main>

<div class="modal" id="inqModal"><div class="box">
  <h2>আগ্রহ জানান</h2>
  <form id="inqForm">
    <input type="hidden" name="listing_id">
    <label>আপনার নাম</label><input name="name" required>
    <label>ফোন</label><input name="phone" required inputmode="tel">
    <label>বার্তা</label><textarea name="message"></textarea>
    <div id="inqMsg" class="msg"></div>
    <div class="row"><button class="btn" type="submit">পাঠান</button><button class="btn gray" type="button" id="inqClose">বন্ধ</button></div>
  </form>
</div></div>

<footer>© Chattogram Steel Scrap Connect</footer>

<script>
const SUPABASE_URL="https://rpvwdlmexlnfwabmpfji.supabase.co";
const SUPABASE_KEY="sb_publishable_qAfkcYvTXs-cfnzufD5vYg_xX7F5dVa";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bnum=s=>{let d=String(s||"").replace(/\D/g,"");if(d.startsWith("880"))return d;if(d.startsWith("0"))return "88"+d;return d?"880"+d:""};
function msg(el,t,ok){el.className="msg "+(ok?"ok":"err");el.textContent=t}

// ট্যাব
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");
  document.querySelectorAll(".sec").forEach(s=>s.classList.remove("on"));$("#"+b.dataset.t).classList.add("on");
  if(b.dataset.t==="admin")checkAdmin();
});

// বিজ্ঞপ্তি তালিকা
async function loadListings(){
  const box=$("#listings");box.innerHTML='<div class="empty">লোড হচ্ছে…</div>';
  let q=sb.from("listings").select("*").eq("status","approved").order("created_at",{ascending:false}).limit(100);
  const t=$("#ft").value;if(t)q=q.eq("type",t);
  const {data,error}=await q;
  if(error){box.innerHTML='<div class="empty">লোড করা যায়নি: '+esc(error.message)+'</div>';return}
  const kw=$("#q").value.trim().toLowerCase();
  const rows=(data||[]).filter(r=>!kw||[r.title,r.scrap_type,r.area,r.description].join(" ").toLowerCase().includes(kw));
  if(!rows.length){box.innerHTML='<div class="empty">কোনো বিজ্ঞপ্তি নেই</div>';return}
  box.innerHTML=rows.map(cardHtml).join("");
}
function cardHtml(r){
  const wa=bnum(r.whatsapp||r.phone);
  const imgs=(r.images||[]).length?'<div class="imgs">'+r.images.map(u=>'<img loading="lazy" src="'+esc(u)+'" alt="">').join("")+'</div>':"";
  const price=r.price?Number(r.price).toLocaleString("bn-BD")+" ৳ "+esc(r.price_note||""):esc(r.price_note||"আলোচনা সাপেক্ষ");
  const qty=r.quantity?Number(r.quantity).toLocaleString("bn-BD")+" "+esc(r.unit||""):"";
  const text=encodeURIComponent("আসসালামু আলাইকুম, Chattogram Steel Scrap Connect-এ আপনার বিজ্ঞপ্তি দেখলাম: "+r.title);
  return '<div class="card">'+imgs+'<div class="pad">'+
   '<span class="badge '+r.type+'">'+(r.type==="sell"?"বিক্রয়":"ক্রয়")+'</span>'+
   '<h3>'+esc(r.title)+'</h3>'+
   '<div class="meta">'+esc(r.scrap_type)+(qty?" · "+qty:"")+(r.area?" · "+esc(r.area):"")+'</div>'+
   '<div style="margin-top:6px;font-weight:600">'+price+'</div>'+
   (r.description?'<p class="meta" style="margin:8px 0 0">'+esc(r.description)+'</p>':"")+
   '<div class="row">'+
   (wa?'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/'+wa+'?text='+text+'">WhatsApp</a>':"")+
   (r.phone?'<a class="btn gray" href="tel:'+esc(r.phone)+'">কল</a>':"")+
   '<button class="btn gray" data-inq="'+r.id+'">আগ্রহ জানান</button></div>'+
   '</div></div>';
}
$("#reload").onclick=loadListings;$("#ft").onchange=loadListings;
let tm;$("#q").oninput=()=>{clearTimeout(tm);tm=setTimeout(loadListings,300)};
document.addEventListener("click",e=>{const id=e.target.dataset&&e.target.dataset.inq;if(id){$("#inqForm").listing_id.value=id;$("#inqMsg").className="msg";$("#inqModal").classList.add("on")}});
$("#inqClose").onclick=()=>$("#inqModal").classList.remove("on");
$("#inqForm").onsubmit=async e=>{e.preventDefault();const f=e.target;
  const {error}=await sb.from("inquiries").insert({listing_id:f.listing_id.value,name:f.name.value,phone:f.phone.value,message:f.message.value});
  if(error)return msg($("#inqMsg"),"পাঠানো যায়নি: "+error.message,false);
  msg($("#inqMsg"),"পাঠানো হয়েছে। ধন্যবাদ!",true);f.reset();setTimeout(()=>$("#inqModal").classList.remove("on"),1200)};

// ছবি প্রিভিউ ও ছোট করা
$("#imgs").onchange=e=>{const box=$("#prev");box.innerHTML="";[...e.target.files].slice(0,4).forEach(f=>{const i=document.createElement("img");i.src=URL.createObjectURL(f);box.appendChild(i)})};
function shrink(file,max=1200){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error("ছবি প্রসেস হয়নি")),"image/jpeg",0.8)};img.onerror=()=>rej(new Error("ছবি পড়া যায়নি"));img.src=URL.createObjectURL(file)})}

// বিজ্ঞপ্তি জমা
$("#postForm").onsubmit=async e=>{e.preventDefault();const f=e.target,m=$("#postMsg"),btn=$("#postBtn");
  btn.disabled=true;msg(m,"জমা হচ্ছে…",true);
  try{
    const urls=[];const files=[...$("#imgs").files].slice(0,4);
    for(const file of files){const blob=await shrink(file);const path=Date.now()+"-"+Math.random().toString(36).slice(2,8)+".jpg";
      const {error}=await sb.storage.from("listing-images").upload(path,blob,{contentType:"image/jpeg"});
      if(error)throw error;urls.push(sb.storage.from("listing-images").getPublicUrl(path).data.publicUrl)}
    const n=k=>f[k].value===""?null:Number(f[k].value);
    const row={type:f.type.value,title:f.title.value.trim(),scrap_type:f.scrap_type.value.trim(),quantity:n("quantity"),unit:f.unit.value,price:n("price"),price_note:f.price_note.value||null,area:f.area.value||null,description:f.description.value||null,contact_name:f.contact_name.value.trim(),phone:f.phone.value.trim(),whatsapp:f.whatsapp.value.trim()||null,images:urls,status:"pending"};
    const {error}=await sb.from("listings").insert(row);if(error)throw error;
    msg(m,"বিজ্ঞপ্তি জমা হয়েছে। অনুমোদনের পর সাইটে দেখা যাবে।",true);f.reset();$("#prev").innerHTML="";
  }catch(err){msg(m,"সমস্যা: "+(err.message||err),false)}
  btn.disabled=false};

// সদস্য আবেদন
$("#joinForm").onsubmit=async e=>{e.preventDefault();const f=e.target;
  const {error}=await sb.from("members").insert({role:f.role.value,name:f.name.value.trim(),company:f.company.value||null,phone:f.phone.value.trim(),whatsapp:f.whatsapp.value.trim()||null,area:f.area.value||null,address:f.address.value||null,status:"pending"});
  if(error)return msg($("#joinMsg"),"সমস্যা: "+error.message,false);
  msg($("#joinMsg"),"আবেদন জমা হয়েছে। যাচাইয়ের পর যোগাযোগ করা হবে।",true);f.reset()};

// অ্যাডমিন
let curTab="listings";
async function checkAdmin(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$("#loginBox").style.display="";$("#dash").style.display="none";return}
  const {data}=await sb.from("admins").select("user_id").eq("user_id",session.user.id);
  if(!data||!data.length){await sb.auth.signOut();$("#loginBox").style.display="";$("#dash").style.display="none";msg($("#loginMsg"),"এই অ্যাকাউন্টে অ্যাডমিন অনুমতি নেই",false);return}
  $("#loginBox").style.display="none";$("#dash").style.display="";loadAdmin();
}
$("#loginForm").onsubmit=async e=>{e.preventDefault();const f=e.target;
  const {error}=await sb.auth.signInWithPassword({email:f.email.value,password:f.password.value});
  if(error)return msg($("#loginMsg"),"লগইন হয়নি: "+error.message,false);
  f.reset();checkAdmin()};
$("#logout").onclick=async()=>{await sb.auth.signOut();checkAdmin()};
document.querySelectorAll("#atabs button").forEach(b=>b.onclick=()=>{curTab=b.dataset.a;document.querySelectorAll("#atabs button").forEach(x=>x.className="btn gray sm");b.className="btn sm";loadAdmin()});

async function loadAdmin(){
  const box=$("#adminList");box.innerHTML='<div class="empty">লোড হচ্ছে…</div>';
  const {data,error}=await sb.from(curTab).select("*").order("created_at",{ascending:false}).limit(200);
  if(error){box.innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}
  if(!data.length){box.innerHTML='<div class="empty">কিছু নেই</div>';return}
  box.innerHTML=data.map(r=>{
    if(curTab==="listings")return '<div class="card"><div class="pad"><span class="badge '+r.status+'">'+r.status+'</span> <span class="badge '+r.type+'">'+r.type+'</span><h3>'+esc(r.title)+'</h3><div class="meta">'+esc(r.scrap_type)+' · '+esc(r.area||"")+' · '+esc(r.contact_name||"")+' · '+esc(r.phone||"")+'</div>'+((r.images||[]).length?'<div class="prev">'+r.images.map(u=>'<img src="'+esc(u)+'">').join("")+'</div>':"")+'<div class="row"><button class="btn sm" data-act="approved" data-id="'+r.id+'">অনুমোদন</button><button class="btn gray sm" data-act="rejected" data-id="'+r.id+'">বাতিল</button><button class="btn gray sm" data-act="sold" data-id="'+r.id+'">বিক্রিত</button><button class="btn red sm" data-del="'+r.id+'">মুছুন</button></div></div></div>';
    if(curTab==="members")return '<div class="card"><div class="pad"><span class="badge '+r.status+'">'+r.status+'</span> <span class="badge sell">'+esc(r.role)+'</span><h3>'+esc(r.name)+(r.company?" — "+esc(r.company):"")+'</h3><div class="meta">'+esc(r.phone)+' · '+esc(r.area||"")+'</div><div class="row"><button class="btn sm" data-act="approved" data-id="'+r.id+'">অনুমোদন</button><button class="btn gray sm" data-act="rejected" data-id="'+r.id+'">বাতিল</button><button class="btn red sm" data-del="'+r.id+'">মুছুন</button></div></div></div>';
    return '<div class="card"><div class="pad"><h3>'+esc(r.name)+' · '+esc(r.phone)+'</h3><div class="meta">'+esc(r.message||"")+'</div><div class="meta">'+new Date(r.created_at).toLocaleString("bn-BD")+'</div><div class="row"><a class="btn wa sm" target="_blank" rel="noopener" href="https://wa.me/'+bnum(r.phone)+'">WhatsApp</a><button class="btn red sm" data-del="'+r.id+'">মুছুন</button></div></div></div>';
  }).join("");
}
$("#adminList").onclick=async e=>{const t=e.target;
  if(t.dataset.act){const {error}=await sb.from(curTab).update({status:t.dataset.act}).eq("id",t.dataset.id);if(error)alert(error.message);loadAdmin()}
  if(t.dataset.del&&confirm("সত্যিই মুছবেন?")){const {error}=await sb.from(curTab).delete().eq("id",t.dataset.del);if(error)alert(error.message);loadAdmin()}};

loadListings();
</script>
